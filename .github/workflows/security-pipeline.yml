name: DevSecOps Security Pipeline

# Runs on every push and PR to main — the same "gate before merge"
# pattern discussed in the pipeline design: secret scanning and SAST
# run first (fast, cheap, catch the obvious stuff early), then SCA
# and IaC scanning, each as an independent job so a failure in one
# doesn't block visibility into the others.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Gitleaks can scan past commits too

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks exits non-zero on any finding by default —
        # that's the actual gating mechanism, no extra config needed.

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci  # curated ruleset tuned for low false-positive CI use
        env:
          SEMGREP_RULES: p/owasp-top-ten

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit against requirements.txt
        run: pip-audit -r requirements.txt
        # pip-audit exits non-zero if it finds a known CVE in a pinned
        # dependency — this is the SCA gate. Swap for `snyk test` or
        # `safety check` if you later add API-key-based tools.

  iac-scan:
    name: IaC Scanning (Checkov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov against Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          output_format: cli
          soft_fail: true
          # soft_fail: true means this job reports findings without
          # blocking the pipeline — a deliberate choice matching the
          # "warn on Medium, hard-fail only on Critical" gating policy
          # discussed earlier. Set to false once you're ready to make
          # this a hard gate.

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, iac-scan]
    if: always()
    steps:
      - name: Report overall status
        run: |
          echo "Secret scan: ${{ needs.secret-scan.result }}"
          echo "SAST:        ${{ needs.sast.result }}"
          echo "SCA:         ${{ needs.sca.result }}"
          echo "IaC scan:    ${{ needs.iac-scan.result }}"
